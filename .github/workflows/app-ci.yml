name: Application CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and smoke-test Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PASSWORD: ci-temporary-database-password
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-temporary-admin-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: bash mvnw -B test

      - name: Build and start application with PostgreSQL
        run: docker compose up --build --detach

      - name: Wait for application readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness; then
              echo
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
